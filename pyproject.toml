[project]
name = "barnsight-edge"
version = "0.1.0"
description = "BarnSight Edge — real-time on-device manure detection"
requires-python = ">=3.10,<3.12"
dependencies = [
  "dotenv",
  "lap>=0.5.12",
  "pydantic-settings>=2.12.0",
  "requests",
  "torch",
  "torchvision",
  "ultralytics>=8.3.246",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "responses>=0.25",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff]
indent-width = 2

[tool.uv]
environments = [
  "sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
